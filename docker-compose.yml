version: '3'

networks:
  zoo:
    external: true

services:
  database-local:
    container_name: email-service-db-local
    image: postgres
    restart: always
    networks:
      - zoo
    volumes:
      - email-service-db-local-volume:/var/lib/postgresql
    ports:
      - "31201:5432"
    environment:
      POSTGRES_USER: email-service
      POSTGRES_PASSWORD: email-service
      POSTGRES_DB: email-service

volumes:
  email-service-db-local-volume: