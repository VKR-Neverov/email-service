<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome, %s!</h1>
    <p>Thank you for registering with us.</p>
    <p>We're excited to have you onboard for secure and efficient crypto payments.</p>
    <p class="note">Note: Please keep your account information confidential for security reasons.</p>

    <span style="opacity: 0">%s</span>
</div>
</body>
</html>
