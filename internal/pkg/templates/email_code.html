<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>OTP Code</h1>
    <p>Your OTP code is: <span class="otp-code">%s</span></p>
    <p>Please use this code to complete your action.</p>
    <p class="note">Note: This OTP code is valid for a single use only and will expire shortly.</p>

    <span style="opacity: 0">%s</span>
</div>
</body>
</html>
